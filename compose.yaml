# BrainHeal — Docker Compose
# Covers the worker and frontend services.
# The local Supabase stack is managed separately via: deno task supabase:start

services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: worker/.env
    ports:
      - '8080:8080'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_SUPABASE_URL
        - VITE_SUPABASE_ANON_KEY
    env_file: frontend/.env
    ports:
      - '3000:80'
    restart: unless-stopped
