name: Deploy to Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations'
        type: boolean
        default: true
      deploy_ingest:
        description: 'Deploy ingest function'
        type: boolean
        default: true
      deploy_stripe_webhook:
        description: 'Deploy stripe-webhook function'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        if: github.event_name == 'push'
        run: |
          BASE=${{ github.event.before }}
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi

          changed=$(git diff --name-only "$BASE" HEAD)

          echo "$changed" | grep -q '^supabase/migrations/'       && echo "migrations=true"     >> "$GITHUB_OUTPUT" || echo "migrations=false"     >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -q '^supabase/functions/_'       && echo "shared=true"         >> "$GITHUB_OUTPUT" || echo "shared=false"         >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -q '^supabase/functions/ingest/' && echo "ingest=true"         >> "$GITHUB_OUTPUT" || echo "ingest=false"         >> "$GITHUB_OUTPUT"
          echo "$changed" | grep -q '^supabase/functions/stripe-webhook/' && echo "stripe_webhook=true" >> "$GITHUB_OUTPUT" || echo "stripe_webhook=false" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations
        if: |
          (github.event_name == 'push' && steps.changes.outputs.migrations == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.run_migrations)
        run: |
          supabase link --project-ref $PROJECT_REF
          supabase db push

      - name: Deploy ingest function
        if: |
          (github.event_name == 'push' && (steps.changes.outputs.ingest == 'true' || steps.changes.outputs.shared == 'true')) ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_ingest)
        run: supabase functions deploy ingest --project-ref $PROJECT_REF

      - name: Deploy stripe-webhook function
        if: |
          (github.event_name == 'push' && (steps.changes.outputs.stripe_webhook == 'true' || steps.changes.outputs.shared == 'true')) ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_stripe_webhook)
        run: supabase functions deploy stripe-webhook --project-ref $PROJECT_REF

